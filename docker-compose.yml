services:
  # Servicio de la Base de Datos (PostgreSQL)
  postgres-db:
    image: postgres:15-alpine
    container_name: postgres_container
    environment:
      POSTGRES_DB: releases_notes
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - network_app

  # Servicio de la Aplicación Java (JAR)
  java-app:
    image: eclipse-temurin:17-jre-alpine
    container_name: java_app_container
    working_dir: /app
    volumes:
      - ./target/notesboard-0.0.1-SNAPSHOT.jar:/app/notesboard.jar
    ports:
      - "8080:8080"
    command: java -jar notesboard.jar
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-db:5432/releases_notes
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
    depends_on:
      - postgres-db
    networks:
      - network_app

volumes:
  postgres_data:

networks:
  network_app: